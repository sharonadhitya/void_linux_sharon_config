# Backend
backend = "glx";              # Use GLX backend (stable for most systems; try "xrender" if issues arise)
glx-no-stencil = true;        # Improves performance with some drivers

# Blur Settings
blur-method = "dual_kawase";  # High-quality blur method
blur-strength = 7;            # Noticeable blur effect
blur-background = true;       # Enable background blur
blur-background-frame = true; # Blur the frame too for consistency
blur-background-fixed = false;# Ensure blur applies to dynamic windows like dmenu

# Exclude certain windows from blur (e.g., docks or desktops)
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'i3-frame'"      # Exclude i3 window decorations if they interfere
];

blur-background-incl = [
    "class_g = 'dmenu'",
    "name = 'dmenu'"
];

# Transparency and Fading
opacity-rule = [
    "75:window_type = 'dock'",
    "100:class_g = 'dmenu'",
    "100:name = 'dmenu'",       # dmenu always fully opaque
    "100:focused",              # Focused windows (including dmenu) at 100% opacity
    "60:unfocused"              # Reduced to 50% opacity for unfocused windows for more dimming
];
inactive-opacity = 0.60
ative-opacity = 1.0;         # Full opacity for active windows (like dmenu)
detect-client-opacity = true; # Respect window-set opacity (e.g., dmenu's alpha patch)
detect-transient = true; 
detect-rounded-corners = false;
focus-exclude = [ ];   # Ensure dmenu stays focused

dim-inactive=true;
dim-strength = 0.45;          # How much to dim background
dim-fixed = false;            # Dim only when inactive
dim-clamp = 1.0; 

# Fading
fading = true;                # Enable fade-in/fade-out effects
fade-in-step = 0.03;          # Speed of fade-in
fade-out-step = 0.03;         # Speed of fade-out
fade-delta = 5;               # Time between fade steps (ms)

# Shadow (optional, for focus contrast)
shadow = false;

# Exclude dmenu from shadow to keep it clean
shadow-exclude = [
    "name = 'dmenu'",
    "class_g = 'dmenu'"
];

# Performance
vsync = true;                 # Reduce tearing
