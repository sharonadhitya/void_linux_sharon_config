# ===================================================================
# MINIMAL VS-CODE-LIKE RANGER + VIM (Void Linux)
# ===================================================================

# View
set viewmode miller
set column_ratios 1,3,4
set preview_files true
set preview_directories true
set use_preview_script true
set collapse_preview true

# Show hidden files
set show_hidden true

# Editor
set editor vim

# Image preview (w3m)
set preview_images true
set preview_images_method w3m
set w3m_delay 0.02

# Sorting
set sort natural
set sort_directories_first true
set sort_case_insensitive true

# UI
set draw_borders both
set padding_right true
set display_size_in_main_column true
set line_numbers false
set mouse_enabled true

# Performance
set idle_delay 1000
set freeze_files false

# ===================================================================
# VS CODE KEYBINDINGS
# ===================================================================

# Open with Vim
map <CR> enter
map <C-s> shell vim %s
map <C-o> console open_with vim%%space
map <C-S> shell vim -O %s

# Tabs
map <C-t> tab_new
map <C-w> tab_close
map <C-TAB> tab_move 1
map <C-S-TAB> tab_move -1

# Fuzzy search (scout)
map <C-p> console scout -f%%space

# Quick actions
map e shell vim %s
map E edit
map q quit
map Q quitall
map R reload_cwd
map <C-l> redraw_window

# Navigation
map h left
map j down
map k up
map l right
map H history_go -1
map L history_go 1

# Bookmarks
map gh cd ~
map ge cd /etc
map gu cd /usr
map gd cd /dev
map gm cd /media
map gr cd /

